name: CI

on:
  push:
    branches: [main, initial-implementation]
  pull_request:
    branches: [main, initial-implementation]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: "cargo fmt --check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check --all

  clippy:
    name: "cargo clippy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets -F dst -- -D warnings
      - run: cargo clippy --workspace --all-targets -F profiling -- -D warnings
      - run: cargo clippy --workspace --all-targets -F observe -- -D warnings
      - run: cargo clippy --workspace --all-targets -F observe,profiling -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --workspace --all-targets --release -- -D warnings
      - run: cargo clippy --workspace --all-targets --release -F dst -- -D warnings
      - run: cargo clippy --workspace --all-targets --release -F observe -- -D warnings

  advisories:
    name: "cargo deny advisories"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny --all-features check advisories

  check-si-guard:
    name: "SI guard (imperial unit markers)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - run: bash scripts/check-si-guard.sh

  build:
    name: "cargo build --release"
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --release

  docs-lint:
    name: "docs: EnergyPlus section citations"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-energyplus-sections.sh

  docs-api:
    name: "docs: API docs build without warnings"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --no-deps

  docs-citations:
    name: "docs: known erroneous citations"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-citations.sh

  docs-ashrae-chapters:
    name: "docs: ASHRAE chapter citations"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-ashrae-chapters.sh

  docs-ashrae-edition:
    name: "docs: ASHRAE HOF edition"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-ashrae-edition.sh

  docs-ochre-hash:
    name: "docs: OCHRE commit hash"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Init OCHRE submodule
        run: git submodule update --init vendors/OCHRE
      - run: bash scripts/check-ochre-commit.sh

  check-version-sync:
    name: "version sync (workspace crates vs pyproject)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_version_sync.py
      - run: python3 scripts/check_version_sync.py --self-test

  check-ocv:
    name: "OCV table synchronisation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - run: bash scripts/check_ocv.sh

  check-ashrae-reference:
    name: "ASHRAE reference fixture sync"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - run: bash scripts/check_ashrae_reference.sh

  bench-check:
    name: "cargo bench --no-run"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo bench --no-run --workspace

  bench-gate-selftest:
    name: "bench gate statistic self-test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # jq and bash only: the gate's statistic (median), its interleaved
      # pairing and its confirmation logic carry their own proof,
      # including the recorded false positive (a runner stall poisoning a
      # mean), the recorded within-job drift (a sequential base-then-head
      # phase shift the paired rounds absorb), a real regression that
      # reproduces on the confirmation rounds, and an unpaired new
      # benchmark.
      - run: bash .github/scripts/bench-gate.sh test

  test:
    name: "cargo nextest run (${{ matrix.features }})"
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings"
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: default
            feature-flags: ""
          - features: dst
            feature-flags: "-F dst"
          - features: profiling
            feature-flags: "-F profiling"
    steps:
      - uses: actions/checkout@v4
      - name: Init OCHRE submodule
        run: git submodule update --init vendors/OCHRE
      # The py_gym tests bind the system python and import numpy for their
      # array buffers; a runner image that ships without python3-numpy
      # panics them at the C-API import. The distro package pins it
      # independently of the image's included software.
      - name: Install numpy for the py_gym tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-numpy
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-nextest
      - name: List stray files (before)
        run: |
          mkdir -p target
          git status --porcelain --ignored --untracked-files=all -- . ':(exclude)target' \
            ':(exclude).venv' ':(exclude)*__pycache__*' ':(exclude)*.pytest_cache*' \
            ':(exclude)*.ruff_cache*' ':(exclude)python/*/_hares*.so' | sort > target/stray-before.txt
      # The threads are the runner's own: --test-threads "$(nproc)" gives
      # each arm its logical cores instead of the committed profile's
      # hardcoded 8 (the command line ranks above .config/nextest.toml in
      # nextest's hierarchy, and a profile would inherit the default
      # profile's 8 anyway, so removing the ci profile's line alone cannot
      # land). The counter probes hold process-wide mutexes and read
      # thread-local mirrors, so they are correct at any thread count.
      - run: cargo nextest run --workspace --no-fail-fast --profile ci ${{ matrix.feature-flags }} --test-threads "$(nproc)"
      - name: Copy JUnit report
        if: success() || failure()
        run: cp target/nextest/ci/nextest-results.xml target/nextest/ci/junit-${{ matrix.features }}.xml
      - name: Stray check
        run: |
          git status --porcelain --ignored --untracked-files=all -- . ':(exclude)target' \
            ':(exclude).venv' ':(exclude)*__pycache__*' ':(exclude)*.pytest_cache*' \
            ':(exclude)*.ruff_cache*' ':(exclude)python/*/_hares*.so' | sort > target/stray-after.txt
          if comm -13 target/stray-before.txt target/stray-after.txt | grep .; then
            echo "::error::the test run wrote files into the working tree"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: nextest-results-${{ matrix.features }}
          path: target/nextest/ci/junit-*.xml

  golden:
    name: "frame_golden compare-all"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The goldens are per-column bit digests, so they must be compared on
      # the rustc release they were captured with. rust-toolchain.toml owns
      # that pin: every job, here included, runs the version it names.
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --release -p frame_golden -- compare-all
      - run: cargo run --release -p frame_golden -F dst -- compare-all

  python-test:
    name: "pytest (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      # The override tests read the OS-HPXML sample documents the vendored
      # reference carries (the HPXML's own samples, inputs the tests use
      # directly); without the submodule the paths do not exist.
      - name: Init OCHRE submodule
        run: git submodule update --init vendors/OCHRE
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev --extra helics
      - run: uv run maturin develop
      - name: List stray files (before)
        run: |
          mkdir -p target
          git status --porcelain --ignored --untracked-files=all -- . ':(exclude)target' \
            ':(exclude).venv' ':(exclude)*__pycache__*' ':(exclude)*.pytest_cache*' \
            ':(exclude)*.ruff_cache*' ':(exclude)python/*/_hares*.so' \
            ':(exclude)test-results.xml' | sort > target/stray-before.txt
      - run: uv run pytest -m "not slow and not ochre" --junitxml=test-results.xml
      - name: Stray check
        run: |
          git status --porcelain --ignored --untracked-files=all -- . ':(exclude)target' \
            ':(exclude).venv' ':(exclude)*__pycache__*' ':(exclude)*.pytest_cache*' \
            ':(exclude)*.ruff_cache*' ':(exclude)python/*/_hares*.so' \
            ':(exclude)test-results.xml' | sort > target/stray-after.txt
          if comm -13 target/stray-before.txt target/stray-after.txt | grep .; then
            echo "::error::the pytest run wrote files into the working tree"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: test-results.xml

  pyright:
    name: "pyright"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The vendored OCHRE reference is pyright's `ochre` import: the
      # execution environments point extraPaths at vendors/OCHRE (the
      # ochre extra installs the package's dependencies only), so the
      # submodule must be checked out or every ochre import fails to
      # resolve.
      - name: Init OCHRE submodule
        run: git submodule update --init vendors/OCHRE
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-extras --all-groups
      - run: uv run --locked --all-extras --all-groups pyright

  ochre-python-test:
    name: "pytest OCHRE comparison (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Init OCHRE submodule
        run: git submodule update --init vendors/OCHRE
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev --extra helics --group ochre --extra rl
      - run: uv run maturin develop --release
      # --fail-on-skip (tests/python/skip_gate.py): an OCHRE install that
      # cannot run the comparison fails the job instead of skipping it.
      - run: uv run pytest -m ochre -rxX --fail-on-skip --junitxml=test-results-ochre.xml
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: pytest-ochre-results-${{ matrix.python-version }}
          path: test-results-ochre.xml

  slow-python-test:
    name: "pytest slow (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Init OCHRE submodule
        run: git submodule update --init vendors/OCHRE
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev --extra helics --group ochre
      - run: uv run maturin develop
      - run: uv run pytest -m "slow and not ochre" --junitxml=test-results-slow.xml
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: pytest-slow-results-${{ matrix.python-version }}
          path: test-results-slow.xml

  coverage:
    name: "coverage"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Init OCHRE submodule
        run: git submodule update --init vendors/OCHRE
      - name: Install numpy for the py_gym tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-numpy
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-info
          path: lcov.info

  bench:
    name: "benchmark regression"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install critcmp
        run: cargo install critcmp --quiet
      - name: Resolve baseline commit
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA=$(git ls-remote origin "refs/heads/$BASE_REF" | cut -f1 | cut -c1-10)
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-parse "$BEFORE" | cut -c1-10)
          else
            BASE_SHA=""
          fi
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
      # The baseline's and the head's benchmark binaries are built once
      # each, in this job, on this runner, in this sitting, and the rounds
      # then ALTERNATE them per benchmark. The earlier design ran the whole
      # base suite and then the whole head suite: any drift inside the job
      # (CPU steal, page-fault behaviour, allocator state) landed after the
      # base phase and was charged to the head. rl_step/dwelling_step_single
      # measured 36.6us on the base and 3.5ms on the head of one job (a
      # stable +9455 percent, 3.4 percent relative stddev) while the same
      # two trees measure indistinguishable paired; the confirmation re-run
      # reproduced it because it re-ran in the same shifted sitting. A base
      # tree whose benches cannot build is unproducible: the step is
      # tolerated, the comparison below notices the missing binaries and
      # skips, and the PR's own benchmark run is still gated by the
      # bench-check job.
      - name: Build the baseline's benchmark binaries
        if: env.BASE_SHA != ''
        continue-on-error: true
        run: |
          # The gate script itself is the head's: the base tree predates
          # the paired design, so its copy is not the one that runs.
          cp .github/scripts/bench-gate.sh "$RUNNER_TEMP/bench-gate.sh"
          git checkout "$BASE_SHA"
          bash "$RUNNER_TEMP/bench-gate.sh" build-binaries "$PWD/target/base-bench"
      - name: Restore PR branch
        if: env.BASE_SHA != ''
        run: git checkout ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the PR's benchmark binaries
        run: bash .github/scripts/bench-gate.sh build-binaries "$PWD/target/head-bench"
      - name: Run the interleaved paired rounds
        run: |
          if [ -z "$(ls -A target/base-bench 2>/dev/null)" ]; then
            echo "::notice::No baseline benchmark binaries could be built at the base commit: comparison skipped"
            exit 0
          fi

          # One screen round: each benchmark runs base then head back to
          # back (the order flips with the round number), so the same
          # bench's two samples sit minutes apart in the same environment
          # instead of one phase and one rebuild apart. One round over the
          # whole suite is what the job's wall time affords; the median
          # over repeated rounds belongs to the confirmation below, which
          # only ever re-runs the flagged benchmarks.
          bash .github/scripts/bench-gate.sh rounds 1 1

          echo '## Benchmark Comparison (the interleaved screen round)' >> "$GITHUB_STEP_SUMMARY"
          PAIRED=$(bash .github/scripts/bench-gate.sh paired \
            target/bench-rounds/base-r1.json target/bench-rounds/head-r1.json)

          UNPAIRED=$(jq -r '.unpaired | join(", ")' <<<"$PAIRED")
          if [ -n "$UNPAIRED" ]; then
            echo "::notice::benchmarks without a sample in every round are not gated: $UNPAIRED"
            echo "Unpaired (a new benchmark has no baseline; never gated): $UNPAIRED" >> "$GITHUB_STEP_SUMMARY"
          fi

          FLAGGED_COUNT=$(jq '.regressions | length' <<<"$PAIRED")
          if [ "$FLAGGED_COUNT" -eq 0 ]; then
            echo "No benchmark regressions exceed 20% threshold on the interleaved screen round"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No benchmark's head/base ratio exceeds the 20% threshold on the interleaved screen round." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo ""
            echo "## Benchmarks flagged by the paired gate (>20% slower on the screen round)"
            bash .github/scripts/bench-gate.sh table "$PAIRED"
            echo ""
            echo "per-round (head/base) is each round's own ratio; the screen is one round, so the spread columns read n/a and the confirmation rounds are what judge the flag. A genuine regression lands in every round; a sitting drift lands on both sides of the round it occupies."
            echo ""
            echo "Re-running ONLY the flagged benchmarks in three fresh interleaved rounds (order flipped each round):"
            echo ""
            echo '```'
            echo "bash .github/scripts/bench-gate.sh rounds 2 3 \"\$(bash .github/scripts/bench-gate.sh filter <<< \$PAIRED)\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::group::Confirmation rounds of the flagged benchmarks"
          BENCH_FILTER=$(bash .github/scripts/bench-gate.sh filter <<<"$PAIRED")
          echo "Re-running: $(jq -r '[.regressions[].name] | join(", ")' <<<"$PAIRED")"
          bash .github/scripts/bench-gate.sh rounds 2 3 "$BENCH_FILTER"
          echo "::endgroup::"

          CONFIRM_FILES=()
          for r in 2 3 4; do
            CONFIRM_FILES+=("target/bench-rounds/base-r$r.json" "target/bench-rounds/head-r$r.json")
          done
          CONFIRMED=$(bash .github/scripts/bench-gate.sh paired "${CONFIRM_FILES[@]}")
          CONFIRMED_COUNT=$(jq '.regressions | length' <<<"$CONFIRMED")

          if [ "$CONFIRMED_COUNT" -gt 0 ]; then
            {
              echo ""
              echo "## Confirmed regressions (the paired ratio holds in the confirmation rounds)"
              bash .github/scripts/bench-gate.sh table "$CONFIRMED"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${CONFIRMED_COUNT} benchmark(s) still regress more than 20% on the confirmation rounds"
            echo ""
            echo "Confirmed benchmarks:"
            echo "$CONFIRMED" | jq -r '.regressions[] | "  \(.name): +\(.pct_slower)% (median \(.current_ns)ns vs baseline \(.baseline_ns)ns, per-round \(.per_round_pct | map(tostring) | join(","))%, rel stddev \(.rel_stddev_pct)%, rel MAD \(.rel_mad_pct)%)"'
            exit 1
          fi

          echo "::notice::${FLAGGED_COUNT} benchmark(s) were flagged on the screen round and the flag did not reproduce on the confirmation rounds; treated as sitting noise"
          echo ""
          echo "Flagged on the screen round, not reproduced:"
          echo "$PAIRED" | jq -r '.regressions[] | "  \(.name): +\(.pct_slower)% (median \(.current_ns)ns vs baseline \(.baseline_ns)ns, per-round \(.per_round_pct | map(tostring) | join(","))%, rel stddev \(.rel_stddev_pct)%, rel MAD \(.rel_mad_pct)%)"'
