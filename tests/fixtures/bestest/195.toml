building_id = 195

# ASHRAE 140-2017 Section 5.2.3.5, Case 195 (the fabric cases sit in
# Section 7 in 140-2023): the solid-conduction in-depth
# test. Case 200's chain (Case 600's envelope with interior IR emittance 0.1
# per 5.2.3.2.1, then exterior IR emittance 0.1 per 5.2.3.4.1) with the 12 m2
# of south windows replaced by the lightweight exterior walls of Table 5-21
# (5.2.3.5). Case 220's base rules apply: infiltration 0 ach (5.2.3.1.1),
# internal gains 0 W (5.2.3.1.2), exterior solar absorptance 0.1 (Table
# 5-34); the "20,20" thermostat (heating 20 C, cooling 20 C). With no
# windows, no gains and no infiltration the case exercises conduction alone
# under the Denver TMY: the floor slab's initial condition dominates the
# first simulated days, which is why the warm-up criteria matter here.

# The warm-up: the [simulation] table's warmup field, the default
# converging warm-up (the EnergyPlus criteria).
