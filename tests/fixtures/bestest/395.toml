building_id = 395

# ASHRAE 140-2017 Section 5.2.3.16, Case 395 (the fabric cases sit in
# Section 7 in 140-2023): the low-mass solid-conduction
# in-depth test under the "20,27" deadband thermostat (heating 20 C, cooling
# 27 C, the Case 400 base's setpoints). Case 600's lightweight walls replace
# the 12 m2 of south windows (5.2.3.16); 0 infiltration, 0 internal gains,
# exterior solar absorptance 0.1, and IR emittance 0.9 interior and exterior
# (Table B1-3's 20,27 row; the 0.1 pair belongs to Case 195's 20,20 row). The
# deadband widens what the free response can do between the setpoints: the
# case isolates conduction dynamics from the thermostat's immediate
# correction.

# The warm-up: the [simulation] table's warmup field, the default
# converging warm-up (the EnergyPlus criteria).
[simulation]
start_time = "2024-01-01T00:00:00-07:00"
time_res = 3600
duration = 31536000
output_chunk_size = 10000
master_seed = 0
[geometry]
number_of_bedrooms = 3.0
floor_area_m2 = 48.0
zone_volume_m3 = 129.6
mass_multiplier = 1.0

[materials]
