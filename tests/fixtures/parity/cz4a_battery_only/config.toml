bldg_id = 1

[simulation]
start_time = "2023-01-01T00:00:00-07:00"
duration = 3600
time_res = 60
output_chunk_size = 1000
master_seed = 0
# The reference this fixture carries was generated with both sides cold
# (OCHRE's initialization_time is None; the engine's warm-up disabled):
# the comparison's initial condition is part of the premise. See
# tests/python/generate_parity_reference.py.
warmup = "disabled"

[[simulation.reports]]
name = "frame"
selection = { verbosity = 3 }
destination = "memory"

# The OCHRE reference holds this battery idle: the declared `Manual`
# control is that battery following no management. (An HPXML battery
# with no declared control is a construction error; `Manual` declared
# explicitly is the declaration.)
[overrides]
Battery = { bms_mode = '"Manual"' }

# The indoor temperature HARES starts this window from (its seeded draw
# within half the deadband, master_seed 0), to which the reference
# generator pins OCHRE's otherwise unseeded starting draw.
[ochre]
initial_temp_setpoint_c = 18.083026715940175

[property_parity]
equipment_count = 15
zone_count = 2
conditioned_zone_count = 1
