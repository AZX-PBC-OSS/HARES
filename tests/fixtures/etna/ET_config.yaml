# define the input and output filenames as a dictionary
filenames: 
  test_software_base: Std140_ET_Output
  input_check_hourly_diff_base: 01_Std140_ET_Inp_Chk_HourlyDiff
  input_check_plots_base: 02_Std140_ET_Inp_Chk_Plots
  output_qhtr_table_base: 03_Std140_ET_Results_Tables
  output_qhtr_plots_base: 04_Std140_ET_Qhtr_HourlyPlots
  output_qhtr_plots_all: 05_Std140_ET_Qhtr_HourlyPlots_all.pdf
  example_data: ExampleSoftwareData.json
  measurement_data: MeasurementData.json

# qhtr template
qhtr_excel_template:
  workbook_name: Std140_ET_Results_Tables_template.xlsx
  worksheet_qhtr_name: Qhtr_source_data
  worksheet_diag_name: Flux_software_source_data

# define a dictionary of start and stop times for best steady state period
# can use as the array of test cases too because the dictionary keys are the
# list of test cases
best_ss_time_periods:
  ET110A:
    - 2000-02-10 16:00:00
    - 2000-02-11 09:00:00
  ET110B:
    - 2000-02-10 16:00:00
    - 2000-02-11 09:00:00
  ET100A:
    - 2000-09-16 08:00:00
    - 2000-09-18 14:00:00
  ET100B:
    - 2000-09-16 08:00:00
    - 2000-09-18 14:00:00

header_text: "ASHRAE Standard 140-2023-B, Informative Annex B8, Section B8.4\n\ 
  Example Results for Section 13 - Building Thermal Fabric Empirical Validation: \
  Cases ET110A1, ET110B1, ET100A1, ET100B1, ET100A3, ET100B3"

# define a dictionary of sheet names for the test cases
test_case_sheets:
  ET110A:
    - ET110A1
  ET110B:
    - ET110B1
  ET100A:
    - ET100A1
    - ET100A3
  ET100B:
    - ET100B1
    - ET100B3

test_case_a:
  - ET110A
  - ET100A
test_case_b:
  - ET110B
  - ET100B

# define a dictionary of units for plotting
# input_variables = ['Tattic', 'Tcellar', 'Tnorth', 'Teast', 'Tsouth', 'Twest', 'Tcell', 'Qfan', 'HWDsafr']
# generated by exporting the dictionary in python to get the degree symbol right
input_variable_units:
  Tattic: "[\xB0C]"
  Tcellar: "[\xB0C]"
  Tnorth: "[\xB0C]"
  Teast: "[\xB0C]"
  Tsouth: "[\xB0C]"
  Twest: "[\xB0C]"
  Tcell: "[\xB0C]"
  Qfan: '[Wh/h]'
  HWDsafr: '[m3/h]'
  Qhtr: '[Wh/h]'

# define a dictionary of software names and colors
# the keys of the dictionary are the names of the software
software_colors:
  Measurement: black
  CSE: lightblue
  DeST: teal
  DesignBuilder: chartreuse
  EnergyPlus: violet
  ESP-r: slateblue
  IES-VE: goldenrod
  TRNSYS: tomato

# Define an array of columns for consistent column order for writing to Excel
column_order:
  - Tool Name
  - Sheet Name
  - Qhtr_meas_avg
  - Qhtr_meas_std
  - Qhtr_meas_min
  - Qhtr_meas_max
  - Qhtr_software_avg
  - Qhtr_software_std
