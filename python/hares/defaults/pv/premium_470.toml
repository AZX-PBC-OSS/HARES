# Premium monocrystalline 470W panel — 2026 high-efficiency residential.
# REC Alpha Pure-RX: 470W at ~22.5% module efficiency (1.96×1.13 m ≈ 2.21 m²).
# Representative of N-type back-contact/perovskite-tandem adjacent panels
# entering mass production through 2028 per ITRPV 2024 Roadmap §4.1.
name = "Premium 470W"
panel_watts = 470
panel_area_m2 = 2.21
# NOCT = Nominal Operating Cell Temperature per IEC 61215.
# 43°C is PVWatts v8 premium module default (lower due to better thermal design).
# SAM PVWatts v8 Technical Reference: NREL/TP-7A40-80694 §2.4.
noct_c = 43.0
# Module type string matching PVWatts v8 module type enumeration.
# "premium" uses gamma = -0.0035 for lower temperature coefficient losses.
# SAM PVWatts v8: Standard gamma = -0.0047, Premium gamma = -0.0035.
module_type = "premium"
# Total system derate factor (wiring, soiling, mismatch, inverter, shading).
# EnergyPlus PVWatts IDD V26-1-0 Generator:PVWatts field N6 default = 0.14 (14%).
# Valid range [0, 0.99]. Applied after temperature derating per PVWatts convention.
system_losses_fraction = 0.14
