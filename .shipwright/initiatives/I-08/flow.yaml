"steps":
  - "id": "implement"
    "label": "Implement"
    "description": "Carry out the routine change"
    "required": true
    "type": "agent"
    "agent_role": "implement"
    "charter": "implement"
    "concerns":
      - "wiring"
      - "test-quality"
      - "testing"
    "includes":
      - "reflection-scaffold"
      - "prove-with-test"
    "challenge": "implement"
    "output":
      - "file": "implementation.md"
        "schema":
          "type": "object"
          "additionalProperties": false
          "required":
            - "passing_commands"
          "properties":
            "passing_commands":
              "type": "array"
              "minItems": 1
              "items":
                "type": "object"
                "properties":
                  "command":
                    "type": "string"
                "required":
                  - "command"
              "description": "Verification commands for this change: populate from the project's configured verification commands where its settings declare them, otherwise discover them from repository configuration (package-manager scripts, test-runner config, Makefile, CI definitions); cover test, typecheck, lint, format-check, and build where they exist"
    "default_next": "round-out-coverage"
    "must_pass":
      - "kind": "from_key"
        "from_key": "passing_commands"
    "status": "in_progress"
    "traversal_history": []
  - "id": "round-out-coverage"
    "label": "Round out coverage"
    "description": "Add regression tests and shore up related test coverage"
    "required": true
    "type": "agent"
    "agent_role": "coverage-round"
    "challenge": "coverage-round"
    "output":
      - "file": "coverage-note.md"
        "schema":
          "type": "object"
          "additionalProperties": false
          "required":
            - "coverage_note_outcome"
          "properties":
            "coverage_note_outcome":
              "type": "string"
              "enum":
                - "written"
                - "skipped"
              "description": "Whether a coverage note was written"
    "default_next": "coverage-triage"
    "status": "pending"
    "traversal_history": []
  - "id": "coverage-triage"
    "label": "Coverage triage"
    "description": "Judge whether the test coverage is adequate or tests are missing"
    "required": true
    "type": "agent"
    "agent_role": "triage"
    "includes":
      - "reflection-scaffold"
      - "prove-with-test"
    "challenge": "triage"
    "output":
      - "file": "coverage-note-quality.md"
        "schema":
          "type": "object"
          "additionalProperties": false
          "required":
            - "coverage_outcome"
            - "failing_tests"
          "properties":
            "coverage_outcome":
              "type": "string"
              "enum":
                - "adequate"
                - "tests_missing"
                - "defect_found"
              "description": "Routing key: coverage adequate, tests missing, or coverage work surfaced a real defect in the implementation (not just a test gap)"
            "new_test_paths":
              "type": "array"
              "items":
                "type": "string"
              "description": "Non-routing metadata: new test paths to track as regression tests"
            "failing_tests":
              "type": "array"
              "items":
                "type": "object"
                "properties":
                  "command":
                    "type": "string"
                  "path":
                    "type": "string"
                  "name":
                    "type": "string"
                "required":
                  - "command"
              "description": "Well-known gate key: commands proving a claimed defect_found genuinely fails; empty for adequate/tests_missing"
    "edges":
      - "when":
          "field": "coverage_outcome"
          "eq": "tests_missing"
        "next": "round-out-coverage"
        "inject": "coverage-note-quality.md marked coverage_outcome: tests_missing; it names the untested paths. Write tests covering exactly those paths; do not re-scope beyond what it flagged."
        "max_traversals": 5
      - "when":
          "field": "coverage_outcome"
          "eq": "defect_found"
        "next": "remediate"
        "inject": "coverage-note-quality.md lists failing_tests; each is a reproducible defect, not a test artifact. Fix the underlying code so every listed test passes; never edit or delete the test to make it pass. round-out-coverage re-runs afterward to add the regression test once the fix lands."
        "max_traversals": 5
    "default_next": "red-team"
    "must_fail":
      - "kind": "from_key"
        "from_key": "failing_tests"
    "side_effects":
      - "action": "append_initiative_frontmatter"
        "field": "regression_tests"
        "from": "new_test_paths"
      - "action": "append_decision_log"
        "action_name": "coverage_triage_defect_without_tests"
        "note": "coverage_outcome is defect_found but failing_tests is empty; the claim carries no failing-test evidence and the must_fail gate had nothing to run"
        "when":
          - "field": "coverage_outcome"
            "eq": "defect_found"
          - "field": "failing_tests"
            "empty": true
    "status": "pending"
    "traversal_history": []
  - "id": "red-team"
    "label": "Red team"
    "description": "Actively try to break what was just implemented with adversarial tests"
    "required": true
    "type": "agent"
    "agent_role": "red-team"
    "charter": "red-team"
    "concerns":
      - "red-teaming"
      - "test-quality"
      - "testing"
    "includes":
      - "reflection-scaffold"
      - "prove-with-test"
    "challenge": "red-team"
    "output":
      - "file": "red-team-note.md"
        "schema":
          "type": "object"
          "additionalProperties": false
          "required":
            - "red_team_outcome"
            - "failing_tests"
          "properties":
            "red_team_outcome":
              "type": "string"
              "enum":
                - "clean"
                - "issues_found"
              "description": "Routing key: no adversarial gaps found, or genuine issues found"
            "failing_tests":
              "type": "array"
              "items":
                "type": "object"
                "properties":
                  "command":
                    "type": "string"
                  "path":
                    "type": "string"
                  "name":
                    "type": "string"
                "required":
                  - "command"
              "description": "Well-known gate key: commands proving the red-team's findings genuinely fail"
    "edges":
      - "when":
          "field": "red_team_outcome"
          "eq": "issues_found"
        "next": "remediate"
        "inject": "red-team-note.md lists failing_tests; each is a reproducible defect, not a test artifact. Fix the underlying code so every listed test passes; never edit or delete the test to make it pass."
        "max_traversals": 5
    "default_next": "review"
    "must_fail":
      - "kind": "from_key"
        "from_key": "failing_tests"
    "side_effects":
      - "action": "append_decision_log"
        "action_name": "red_team_findings_without_tests"
        "note": "red_team_outcome is issues_found but failing_tests is empty; the findings carry no failing-test evidence and the must_fail gate had nothing to run"
        "when":
          - "field": "red_team_outcome"
            "eq": "issues_found"
          - "field": "failing_tests"
            "empty": true
    "status": "pending"
    "traversal_history": []
  - "id": "review"
    "label": "Review"
    "description": "Review the change for correctness"
    "required": true
    "type": "agent"
    "agent_role": "review"
    "charter": "review-findings"
    "concerns":
      - "test-quality"
      - "security"
    "includes":
      - "reflection-scaffold"
      - "prove-with-test"
      - "severity-ladder"
    "challenge": "review"
    "output":
      - "file": "review.md"
        "schema":
          "type": "object"
          "additionalProperties": false
          "required":
            - "review_outcome"
          "properties":
            "review_outcome":
              "type": "string"
              "enum":
                - "clean"
                - "findings"
                - "test_gaps"
                - "halt"
              "description": "Routing key: review verdict"
    "edges":
      - "when":
          "field": "review_outcome"
          "eq": "findings"
        "next": "remediate"
        "inject": "review.md carries severity-laddered findings. Address every finding at the severity the ladder assigns: critical and major findings must be fixed; a minor finding may be deferred only with the justification recorded."
        "max_traversals": 5
      - "when":
          "field": "review_outcome"
          "eq": "test_gaps"
        "next": "round-out-coverage"
        "inject": "review.md flagged test_gaps; it names the coverage review found missing. Add tests covering exactly what it named."
        "max_traversals": 5
      - "when":
          "field": "review_outcome"
          "eq": "halt"
        "next": "halt"
    "default_next": "commit"
    "must_pass":
      - "kind": "from_key"
        "from_key": "passing_commands"
    "status": "pending"
    "traversal_history": []
  - "id": "remediate"
    "label": "Remediate"
    "description": "Fix the defects red-team, review, or coverage-triage found in the implemented work"
    "required": true
    "type": "agent"
    "agent_role": "fix"
    "charter": "implement"
    "concerns":
      - "wiring"
      - "test-quality"
      - "testing"
    "includes":
      - "reflection-scaffold"
      - "prove-with-test"
    "challenge": "fix"
    "default_next": "round-out-coverage"
    "must_pass":
      - "kind": "from_key"
        "from_key": "failing_tests"
      - "kind": "from_key"
        "from_key": "passing_commands"
    "status": "pending"
    "traversal_history": []
  - "id": "commit"
    "label": "Commit"
    "description": "Commit the reviewed change"
    "required": true
    "type": "agent"
    "agent_role": "commit"
    "challenge": true
    "default_next": "done"
    "status": "pending"
    "traversal_history": []
