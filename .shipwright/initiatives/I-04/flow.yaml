"steps":
  - "id": "diagnose"
    "label": "Diagnose"
    "description": "Identify the root cause of the observed symptom"
    "required": true
    "type": "agent"
    "agent_role": "fix-diagnose"
    "challenge": "fix-diagnose"
    "output":
      - "file": "rca.md"
        "schema":
          "type": "object"
          "additionalProperties": false
          "required":
            - "diagnosis_outcome"
            - "passing_commands"
          "properties":
            "diagnosis_outcome":
              "type": "string"
              "enum":
                - "root_cause_found"
                - "no_bug_found"
              "description": "Routing key — root cause found or no bug"
            "complexity":
              "type": "string"
              "enum":
                - "trivial"
                - "simple"
                - "moderate"
                - "complex"
              "description": "Not a routing key — but every later step in this flow reads it to select the matching role tier (CLI/model/reasoning effort), when the resolved role declares one"
            "failing_tests":
              "type": "array"
              "items":
                "type": "object"
                "properties":
                  "command":
                    "type": "string"
                  "path":
                    "type": "string"
                  "name":
                    "type": "string"
                "required":
                  - "command"
              "description": "Well-known gate key: commands proving the bug reproduces"
            "passing_commands":
              "type": "array"
              "minItems": 1
              "items":
                "type": "object"
                "properties":
                  "command":
                    "type": "string"
                "required":
                  - "command"
              "description": "Verification commands discovered from project configuration (test, typecheck, lint, format-check, build)"
    "edges":
      - "when":
          "field": "diagnosis_outcome"
          "eq": "no_bug_found"
        "next": "done"
      - "when":
          "field": "diagnosis_outcome"
          "eq": "root_cause_found"
        "next": "reproduce"
    "default_next": "reproduce"
    "status": "done"
    "outcome": "converged"
    "traversal_history":
      - "timestamp": "2026-09-13T04:50:52.150Z"
        "outcomeValue": "root_cause_found"
        "edgeTaken": "reproduce"
  - "id": "reproduce"
    "label": "Reproduce"
    "description": "Reproduce the bug with a failing test or documented bypass"
    "required": true
    "type": "agent"
    "skippable": true
    "agent_role": "reproduce"
    "challenge": "reproduce"
    "output":
      - "file": "reproduction.md"
        "schema":
          "type": "object"
          "additionalProperties": false
          "required":
            - "reproduction_outcome"
            - "failing_tests"
          "properties":
            "reproduction_outcome":
              "type": "string"
              "enum":
                - "confirmed"
                - "bypassed"
              "description": "Routing key — confirmed failing test or documented bypass"
            "reason":
              "type": "string"
              "description": "Documented bypass reason — a bypassed outcome without a reason is logged as a trace error"
            "failing_tests":
              "type": "array"
              "items":
                "type": "object"
                "properties":
                  "command":
                    "type": "string"
                  "path":
                    "type": "string"
                  "name":
                    "type": "string"
                "required":
                  - "command"
              "description": "Well-known gate key: commands that must fail before fix and pass after — an explicit empty list on a bypassed outcome is the designed 'nothing to run' declaration"
    "default_next": "fix"
    "must_fail":
      - "kind": "from_key"
        "from_key": "failing_tests"
    "side_effects":
      - "action": "append_decision_log"
        "action_name": "no_test_reason_accepted"
        "reason_from": "reason"
        "when":
          "field": "reproduction_outcome"
          "eq": "bypassed"
      - "action": "append_decision_log"
        "action_name": "no_tests_declared"
        "note": "reproduction_outcome is confirmed but failing_tests is empty — the must_fail gate had no commands to run, so the reproduction claim carried no executable evidence"
        "when":
          - "field": "reproduction_outcome"
            "eq": "confirmed"
          - "field": "failing_tests"
            "empty": true
      - "action": "append_initiative_frontmatter"
        "field": "regression_tests"
        "from": "failing_tests"
        "when":
          "field": "reproduction_outcome"
          "eq": "confirmed"
        "item_path": "path"
    "status": "done"
    "outcome": "converged"
    "traversal_history":
      - "timestamp": "2026-09-13T04:55:34.483Z"
        "edgeTaken": "fix"
  - "id": "fix"
    "label": "Fix"
    "description": "Implement the corrective change and verify the symptom is resolved"
    "required": true
    "type": "agent"
    "agent_role": "fix"
    "charter": "implement"
    "concerns":
      - "wiring"
      - "test-quality"
      - "testing"
    "includes":
      - "reflection-scaffold"
      - "prove-with-test"
    "challenge": "fix"
    "default_next": "round-out-coverage"
    "must_pass":
      - "kind": "from_key"
        "from_key": "failing_tests"
      - "kind": "from_key"
        "from_key": "passing_commands"
    "status": "done"
    "outcome": "converged"
    "traversal_history":
