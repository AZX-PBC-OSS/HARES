        "edgeTaken": "round-out-coverage"
      - "timestamp": "2026-09-13T07:47:32.974Z"
        "edgeTaken": "round-out-coverage"
      - "timestamp": "2026-09-13T08:47:42.912Z"
        "edgeTaken": "round-out-coverage"
  - "id": "round-out-coverage"
    "label": "Round out coverage"
    "description": "Add regression tests and shore up related test coverage"
    "required": true
    "type": "agent"
    "agent_role": "coverage-round"
    "challenge": "coverage-round"
    "output":
      - "file": "coverage-note.md"
        "schema":
          "type": "object"
          "additionalProperties": false
          "required":
            - "coverage_note_outcome"
          "properties":
            "coverage_note_outcome":
              "type": "string"
              "enum":
                - "written"
                - "skipped"
              "description": "Whether a coverage note was written"
    "default_next": "coverage-triage"
    "status": "done"
    "outcome": "converged"
    "traversal_history":
      - "timestamp": "2026-09-13T07:07:46.209Z"
        "edgeTaken": "coverage-triage"
      - "timestamp": "2026-09-13T07:48:21.685Z"
        "edgeTaken": "coverage-triage"
      - "timestamp": "2026-09-13T08:48:31.680Z"
        "edgeTaken": "coverage-triage"
  - "id": "coverage-triage"
    "label": "Coverage triage"
    "description": "Judge whether the test coverage is adequate or tests are missing"
    "required": true
    "type": "agent"
    "agent_role": "triage"
    "includes":
      - "reflection-scaffold"
      - "prove-with-test"
    "challenge": "triage"
    "output":
      - "file": "coverage-note-quality.md"
        "schema":
          "type": "object"
          "additionalProperties": false
          "required":
            - "coverage_outcome"
            - "failing_tests"
          "properties":
            "coverage_outcome":
              "type": "string"
              "enum":
                - "adequate"
                - "tests_missing"
                - "defect_found"
              "description": "Routing key — coverage adequate, tests missing, or coverage work surfaced a real defect in the implementation (not just a test gap)"
            "new_test_paths":
              "type": "array"
              "items":
                "type": "string"
              "description": "Non-routing metadata: new test paths to track as regression tests"
            "failing_tests":
              "type": "array"
              "items":
                "type": "object"
                "properties":
                  "command":
                    "type": "string"
                  "path":
                    "type": "string"
                  "name":
                    "type": "string"
                "required":
                  - "command"
              "description": "Well-known gate key: commands proving a claimed defect_found genuinely fails; empty for adequate/tests_missing"
    "edges":
      - "when":
          "field": "coverage_outcome"
          "eq": "tests_missing"
        "next": "round-out-coverage"
        "inject": "coverage-note-quality.md marked coverage_outcome: tests_missing — it names the untested paths. Write tests covering exactly those paths; do not re-scope beyond what it flagged."
        "max_traversals": 5
      - "when":
          "field": "coverage_outcome"
          "eq": "defect_found"
        "next": "fix"
        "inject": "coverage-note-quality.md lists failing_tests — each is a reproducible defect, not a test artifact. Fix the underlying code so every listed test passes; never edit or delete the test to make it pass. round-out-coverage re-runs afterward to add the regression test once the fix lands."
        "max_traversals": 5
    "default_next": "red-team"
    "must_fail":
      - "kind": "from_key"
        "from_key": "failing_tests"
    "side_effects":
      - "action": "append_decision_log"
        "action_name": "coverage_triage_defect_without_tests"
        "note": "coverage_outcome is defect_found but failing_tests is empty — the claim carries no failing-test evidence and the must_fail gate had nothing to run"
        "when":
          - "field": "coverage_outcome"
            "eq": "defect_found"
          - "field": "failing_tests"
            "empty": true
      - "action": "append_initiative_frontmatter"
        "field": "regression_tests"
        "from": "new_test_paths"
    "status": "done"
    "outcome": "converged"
    "traversal_history":
      - "timestamp": "2026-09-13T07:09:08.154Z"
        "edgeTaken": "red-team"
      - "timestamp": "2026-09-13T07:49:24.010Z"
        "edgeTaken": "red-team"
      - "timestamp": "2026-09-13T08:50:01.299Z"
        "edgeTaken": "red-team"
  - "id": "red-team"
    "label": "Red team"
    "description": "Actively try to break what was just fixed with adversarial tests, before the final review"
    "required": true
    "type": "agent"
    "agent_role": "red-team"
    "charter": "red-team"
    "concerns":
      - "red-teaming"
      - "test-quality"
      - "testing"
    "includes":
      - "reflection-scaffold"
      - "prove-with-test"
    "challenge": "red-team"
    "output":
      - "file": "red-team-note.md"
        "schema":
          "type": "object"
          "additionalProperties": false
          "required":
            - "red_team_outcome"
            - "failing_tests"
          "properties":
            "red_team_outcome":
              "type": "string"
              "enum":
                - "clean"
                - "issues_found"
              "description": "Routing key — no adversarial gaps found, or genuine issues found"
            "failing_tests":
              "type": "array"
              "items":
                "type": "object"
                "properties":
                  "command":
                    "type": "string"
                  "path":
                    "type": "string"
                  "name":
                    "type": "string"
                "required":
                  - "command"
              "description": "Well-known gate key: commands proving the red-team's findings genuinely fail"
    "edges":
      - "when":
          "field": "red_team_outcome"
          "eq": "issues_found"
        "next": "fix"
        "inject": "red-team-note.md lists failing_tests — each is a reproducible defect, not a test artifact. Fix the underlying code so every listed test passes; never edit or delete the test to make it pass."
        "max_traversals": 5
    "default_next": "review"
    "must_fail":
      - "kind": "from_key"
        "from_key": "failing_tests"
    "side_effects":
      - "action": "append_decision_log"
        "action_name": "red_team_findings_without_tests"
        "note": "red_team_outcome is issues_found but failing_tests is empty — the findings carry no failing-test evidence and the must_fail gate had nothing to run"
        "when":
          - "field": "red_team_outcome"
            "eq": "issues_found"
          - "field": "failing_tests"
            "empty": true
    "status": "done"
    "outcome": "converged"
    "traversal_history":
      - "timestamp": "2026-09-13T07:32:24.194Z"
        "outcomeValue": "issues_found"
        "edgeTaken": "fix"
      - "timestamp": "2026-09-13T08:16:04.015Z"
        "edgeTaken": "review"
      - "timestamp": "2026-09-13T09:05:09.706Z"
        "edgeTaken": "review"
  - "id": "review"
    "label": "Review"
    "description": "Adversarial review of the fix for correctness and regression risk"
    "required": true
    "type": "agent"
    "agent_role": "review"
    "charter": "review-findings"
    "concerns":
      - "test-quality"
      - "security"
    "includes":
      - "reflection-scaffold"
      - "prove-with-test"
      - "severity-ladder"
    "challenge": "fix-review"
    "output":
      - "file": "review.md"
        "schema":
          "type": "object"
          "additionalProperties": false
          "required":
            - "review_outcome"
          "properties":
            "review_outcome":
              "type": "string"
              "enum":
                - "clean"
                - "findings"
                - "halt"
                - "clean_with_nits_applied"
              "description": "Routing key — review verdict"
    "edges":
      - "when":
          "field": "review_outcome"
          "eq": "findings"
        "next": "fix"
        "inject": "review.md carries severity-laddered findings. Address every finding at the severity the ladder assigns — critical and major findings must be fixed; a minor finding may be deferred only with the justification recorded."
        "max_traversals": 5
      - "when":
          "field": "review_outcome"
          "eq": "halt"
        "next": "halt"
    "default_next": "retrospective"
    "must_pass":
      - "kind": "from_key"
        "from_key": "passing_commands"
    "status": "done"
    "outcome": "converged"
    "traversal_history":
      - "timestamp": "2026-09-13T08:33:59.556Z"
        "outcomeValue": "findings"
        "edgeTaken": "fix"
      - "timestamp": "2026-09-13T09:25:13.220Z"
        "edgeTaken": "retrospective"
  - "id": "retrospective"
    "label": "Retrospective"
    "description": "Assess what went wrong and whether a defense was added"
    "required": true
    "type": "agent"
    "agent_role": "retrospective"
    "challenge": "retrospective"
    "output":
      - "file": "retro.md"
        "schema":
          "type": "object"
          "additionalProperties": false
          "required":
            - "retro_outcome"
          "properties":
            "retro_outcome":
              "type": "string"
              "enum":
                - "sound"
                - "defense_gap"
                - "new_bug_found"
              "description": "Routing key — retrospective verdict"
    "edges":
      - "when":
          "field": "retro_outcome"
          "eq": "defense_gap"
        "next": "fix"
        "inject": "retro.md identified a defense_gap — the fix resolved the symptom but no regression test or structural guard prevents recurrence. Add the defense retro.md describes."
        "max_traversals": 5
      - "when":
          "field": "retro_outcome"
          "eq": "new_bug_found"
        "next": "fix"
        "inject": "retro.md's retrospective on this fix uncovered a separate, newly-found bug. Fix the new bug it describes; this is independent of the original symptom already resolved."
        "max_traversals": 5
    "default_next": "commit"
    "status": "done"
    "outcome": "converged"
    "traversal_history":
      - "timestamp": "2026-09-13T09:27:46.495Z"
        "edgeTaken": "commit"
  - "id": "commit"
    "label": "Commit"
    "description": "Commit the reviewed and validated fix"
    "required": true
    "type": "agent"
    "agent_role": "commit"
    "challenge": true
    "default_next": "done"
