engine_version: 2
kind: research
description: "Investigate a problem space and produce a knowledge document"
recipe_summary: "research, check-consistency, synthesise, document"
start:
  next: research

steps:
  - id: research
    label: Research
    description: "Explore the problem space, gather information, and identify patterns"
    required: true
    skippable: true
    type: agent
    agent_role: research
    charter: research
    challenge: research
    includes: [reflection-scaffold, artifact-alignment]
    output:
      file: research.md
      schema:
        type: object
        additionalProperties: false
        required: [passing_commands]
        properties:
          passing_commands:
            type: array
            minItems: 1
            items:
              type: object
              properties:
                command: { type: string }
              required: [command]
            description: "Verification commands discovered from project configuration (test, typecheck, lint, format-check, build)"
    default_next: check-consistency

  - id: check-consistency
    label: Check consistency
    description: "Verify all prior artifacts are aligned: no contradictions, no drifted duplications, no gaps between artifacts. Resolve conflicts with the operator and update artifacts to cede authority."
    required: true
    skippable: true
    type: agent
    agent_role: check-consistency
    challenge: check-consistency
    includes: [reflection-scaffold, artifact-alignment, interactive-protocol]
    output:
      file: consistency-report.md
      schema:
        type: object
        additionalProperties: false
        required: [consistency_outcome]
        properties:
          consistency_outcome:
            type: string
            enum: [aligned, gaps_found]
            description: "Routing key — artifacts aligned or gaps found requiring more research"
    edges:
      - when: { field: consistency_outcome, eq: gaps_found }
        next: research
        max_traversals: 5
        inject: "address the research gaps the consistency check found"
    default_next: synthesise

  - id: synthesise
    label: Synthesise
    description: "Distill research findings into actionable insights and recommendations"
    required: true
    type: agent
    agent_role: spec
    charter: spec
    challenge: spec
    includes: [reflection-scaffold, artifact-alignment, interactive-protocol]
    output:
      file: synthesis.md
      schema:
        type: object
        additionalProperties: false
        required: [synthesis_outcome]
        properties:
          synthesis_outcome:
            type: string
            enum: [complete, needs_more_research]
            description: "Routing key — synthesis complete or more research needed"
    edges:
      - when: { field: synthesis_outcome, eq: needs_more_research }
        next: research
        max_traversals: 5
        inject: "conduct the additional research the synthesis identified as missing"
    default_next: document

  - id: document
    label: Document
    description: "Write the research output as a version-controlled knowledge artifact"
    required: true
    type: agent
    agent_role: implement
    charter: implement
    challenge: implement
    includes: [reflection-scaffold, prove-with-test]
    concerns: [wiring, test-quality, testing]
    must_pass:
      - { from_key: passing_commands }
    output:
      file: research-document.md
      schema:
        type: object
        additionalProperties: false
    default_next: done
