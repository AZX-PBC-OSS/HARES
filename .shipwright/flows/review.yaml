engine_version: 2
kind: review
description: "Review code changes against quality and correctness criteria"
recipe_summary: "explore, breakdown, parallel-review, scrutiny, consolidate, apply-findings, commit"
start:
  next: explore

steps:
  - id: explore
    label: Explore context
    description: "Read the diff plus surrounding code to understand why the change exists and produce a structured summary of what changed"
    required: true
    type: agent
    agent_role: review-explorer
    charter: explore
    challenge: explore
    concerns: [testing]
    output:
      file: changes.md
      schema:
        type: object
        additionalProperties: false
        required: [passing_commands]
        properties:
          passing_commands:
            type: array
            minItems: 1
            items:
              type: object
              properties:
                command: { type: string }
              required: [command]
            description: "Verification commands discovered from project configuration (test, typecheck, lint, format-check, build)"
    default_next: breakdown

  - id: breakdown
    label: Break down review areas
    description: "Decompose the change into one review-area artifact per area of concern"
    required: true
    type: agent
    agent_role: review-breakdown
    challenge: review-breakdown
    output:
      - pattern: 'review-areas/*/area.md'
        schema: &review-area-contract
          type: object
          additionalProperties: false
          x-code-contract: review-area-frontmatter
          required: [id, status, depends_on, area, description, concerns]
          properties:
            id:
              type: string
              description: "Unique area identifier — the slug naming this area's directory (e.g. type-safety)"
            status:
              type: string
              enum: [pending, in_progress, done, failed, skipped]
              description: "Subflow child state — write pending; the review fan-out and operator actions advance it"
            depends_on:
              type: array
              items: { type: string }
              description: "Sibling area ids whose findings this area depends on — empty for independent areas"
            area:
              type: string
              description: "Short hyphenated area name (e.g. type-safety, security, api-boundary)"
            description:
              type: string
              description: "One sentence describing what this area covers in the context of this change"
            concerns:
              type: array
              items: { type: string }
              description: "Concern names from the workspace catalogue that apply to this area"
            complexity:
              type: string
              enum: [trivial, simple, moderate, complex]
              description: "Not a routing key — the review-area subflow reads it to select the matching role tier (CLI/model/reasoning effort) for this area's reviewer, when the resolved role declares one. A concurrency-heavy or security-sensitive area warrants a higher tier than a small, low-risk one."
    default_next: parallel-review

  - id: parallel-review
    label: Parallel review
    description: "Review each area in depth — one child flow per area, bounded at three in flight, each area's findings surviving any other area's failure"
    required: true
    type: subflow
    subflow:
      recipe: review-area
      for_each:
        pattern: 'review-areas/*/area.md'
        schema: *review-area-contract
      max_concurrency: 3
      on_child_failure: drain_independent
    output:
      - pattern: 'review-areas/*/findings.md'
        schema:
          type: object
          additionalProperties: false
          required: [review_outcome]
          properties:
            review_outcome:
              type: string
              enum: [clean, findings, halt, clean_with_nits_applied]
    default_next: scrutiny

  - id: scrutiny
    label: Scrutiny
    description: "Second-pass validation of review findings by a cross-model scrutineer"
    required: true
    type: agent
    agent_role: review-scrutineer
    challenge: review-scrutineer
    output:
      file: scrutiny.md
      schema:
        type: object
        additionalProperties: false
        required: [scrutiny_outcome]
        properties:
          scrutiny_outcome:
            type: string
            enum: [clean, findings, halt]
            description: "Routing key — scrutiny verdict on the parallel review findings"
    edges:
      - when: { field: scrutiny_outcome, eq: findings }
        next: parallel-review
        max_traversals: 5
        inject: "re-open the areas you flagged by setting their status back to pending in their review-areas/<area>/area.md files — only the areas you re-open are reviewed again"
      - when: { field: scrutiny_outcome, eq: halt }
        next: halt
    default_next: consolidate

  - id: consolidate
    label: Consolidate
    description: "Merge per-area findings into a single deduplicated review document"
    required: true
    type: agent
    agent_role: review-consolidator
    charter: review-findings
    challenge: review-consolidator
    output:
      file: review-report.md
      schema:
        type: object
        additionalProperties: false
        required: [consolidate_outcome]
        properties:
          consolidate_outcome:
            type: string
            enum: [clean, findings, halt]
            description: "Routing key — consolidation verdict"
    edges:
      - when: { field: consolidate_outcome, eq: findings }
        next: parallel-review
        max_traversals: 5
        inject: "re-open the areas whose findings are incomplete or contradictory by setting their status back to pending in their review-areas/<area>/area.md files — only the areas you re-open are reviewed again"
      - when: { field: consolidate_outcome, eq: halt }
        next: halt
    default_next: apply-findings

  - id: apply-findings
    label: Apply findings
    description: "Implement the consolidated findings against the reviewed code"
    required: true
    type: agent
    agent_role: apply-findings
    charter: implement
    challenge: apply-findings
    concerns: [wiring, test-quality, testing]
    must_pass:
      - { from_key: passing_commands }
    output:
      file: applied.md
      schema:
        type: object
        additionalProperties: false
        required: [apply_outcome]
        properties:
          apply_outcome:
            type: string
            enum: [applied, skipped, partial]
            description: "Routing key — findings applied, skipped, or partially applied"
    default_next: commit

  - id: commit
    label: Commit
    description: "Commit the reviewed and applied changes"
    required: true
    type: agent
    agent_role: commit
    challenge: true
    default_next: done
