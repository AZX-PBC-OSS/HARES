engine_version: 2
kind: fix
description: "Diagnose and fix a bug, with regression prevention"
recipe_summary: "diagnose, reproduce, plan-fix, plan-fix-critique, fix, round-out-coverage, coverage-triage, red-team, review, retrospective, commit"
start:
  next: diagnose

steps:
  - id: diagnose
    label: Diagnose
    description: "Identify the root cause of the observed symptom"
    required: true
    type: agent
    agent_role: fix-diagnose
    challenge: fix-diagnose
    output:
      file: rca.md
      schema:
        type: object
        additionalProperties: false
        required: [diagnosis_outcome, passing_commands]
        properties:
          diagnosis_outcome:
            type: string
            enum: [root_cause_found, no_bug_found]
            description: "Routing key — root cause found or no bug"
          complexity:
            type: string
            enum: [trivial, simple, moderate, complex]
            description: "Not a routing key — but every later step in this flow reads it to select the matching role tier (CLI/model/reasoning effort), when the resolved role declares one"
          failing_tests:
            type: array
            items:
              type: object
              properties:
                command: { type: string }
                path: { type: string }
                name: { type: string }
              required: [command]
            description: "Well-known gate key: commands proving the bug reproduces"
          passing_commands:
            type: array
            minItems: 1
            items:
              type: object
              properties:
                command: { type: string }
              required: [command]
            description: "Verification commands discovered from project configuration (test, typecheck, lint, format-check, build)"
    edges:
      - when:
          field: diagnosis_outcome
          eq: no_bug_found
        next: done
      - when:
          field: diagnosis_outcome
          eq: root_cause_found
        next: reproduce
    default_next: reproduce

  - id: reproduce
    label: Reproduce
    description: "Reproduce the bug with a failing test or documented bypass"
    required: true
    skippable: true
    type: agent
    agent_role: reproduce
    challenge: reproduce
    output:
      file: reproduction.md
      schema:
        type: object
        additionalProperties: false
        required: [reproduction_outcome, failing_tests]
        properties:
          reproduction_outcome:
            type: string
            enum: [confirmed, bypassed]
            description: "Routing key — confirmed failing test or documented bypass"
          reason:
            type: string
            description: "Documented bypass reason — a bypassed outcome without a reason is logged as a trace error"
          failing_tests:
            type: array
            items:
              type: object
              properties:
                command: { type: string }
                path: { type: string }
                name: { type: string }
              required: [command]
            description: "Well-known gate key: commands that must fail before fix and pass after — an explicit empty list on a bypassed outcome is the designed 'nothing to run' declaration"
    must_fail:
      - { from_key: failing_tests }
    default_next: plan-fix
    side_effects:
      - when:
          field: reproduction_outcome
          eq: bypassed
        action: append_decision_log
        action_name: no_test_reason_accepted
        reason_from: reason
      - when:
          - field: reproduction_outcome
            eq: confirmed
          - field: failing_tests
            empty: true
        action: append_decision_log
        action_name: no_tests_declared
        note: "reproduction_outcome is confirmed but failing_tests is empty — the must_fail gate had no commands to run, so the reproduction claim carried no executable evidence"
      - when:
          field: reproduction_outcome
          eq: confirmed
        action: append_initiative_frontmatter
        field: regression_tests
        from: failing_tests
        item_path: path

  - id: plan-fix
    label: Plan fix
    description: "Commit to one small, verifiable approach for fixing the confirmed root cause, before any code changes"
    required: true
    type: agent
    agent_role: plan-fix
    charter: fix-plan
    challenge: plan-fix
    includes: [reflection-scaffold]
    output:
      file: fix-plan.md
      schema:
        type: object
        additionalProperties: false
        required: [plan_outcome]
        properties:
          plan_outcome:
            type: string
            enum: [ready, blocked]
            description: "Routing key — ready to hand to the fix step, or blocked because planning revealed the RCA's root cause is wrong or the fix cannot be scoped to a single verifiable change"
    edges:
      - when:
          field: plan_outcome
          eq: blocked
        next: halt
    default_next: plan-fix-critique

  - id: plan-fix-critique
    label: Plan fix critique
    description: "Adversarial critique of the fix plan against the same fix-plan charter its author wrote to — separation of duty between plan author and plan critic"
    required: true
    type: agent
    agent_role: critique
    charter: fix-plan
    challenge: critique
    includes: [reflection-scaffold, severity-ladder]
    output:
      file: fix-plan-critique.md
      schema:
        type: object
        additionalProperties: false
        required: [critique_outcome]
        properties:
          critique_outcome:
            type: string
            enum: [clean, findings, halt]
            description: "Routing key — plan critique verdict"
    edges:
      - when:
          field: critique_outcome
          eq: findings
        next: plan-fix
        max_traversals: 5
        inject: "fix-plan-critique.md marked critique_outcome: findings — it lists specific problems with the fix plan. Address the named findings in fix-plan.md without re-scoping the fix beyond what the findings raise."
      - when:
          field: critique_outcome
          eq: halt
        next: halt
    default_next: fix

  - id: fix
    label: Fix
    description: "Implement the corrective change and verify the symptom is resolved"
    required: true
    type: agent
    agent_role: fix
    charter: implement
    challenge: fix
    includes: [reflection-scaffold, prove-with-test]
    concerns: [wiring, test-quality, testing]
    must_pass:
      - { from_key: failing_tests }
      - { from_key: passing_commands }
    default_next: round-out-coverage

  - id: round-out-coverage
    label: Round out coverage
    description: "Add regression tests and shore up related test coverage"
    required: true
    type: agent
    agent_role: coverage-round
    challenge: coverage-round
    output:
      file: coverage-note.md
      schema:
        type: object
        additionalProperties: false
        required: [coverage_note_outcome]
        properties:
          coverage_note_outcome:
            type: string
            enum: [written, skipped]
            description: "Whether a coverage note was written"
    default_next: coverage-triage

  - id: coverage-triage
    label: Coverage triage
    description: "Judge whether the test coverage is adequate or tests are missing"
    required: true
    type: agent
    agent_role: triage
    challenge: triage
    includes: [reflection-scaffold, prove-with-test]
    output:
      file: coverage-note-quality.md
      schema:
        type: object
        additionalProperties: false
        required: [coverage_outcome, failing_tests]
        properties:
          coverage_outcome:
            type: string
            enum: [adequate, tests_missing, defect_found]
            description: "Routing key — coverage adequate, tests missing, or coverage work surfaced a real defect in the implementation (not just a test gap)"
          new_test_paths:
            type: array
            items: { type: string }
            description: "Non-routing metadata: new test paths to track as regression tests"
          failing_tests:
            type: array
            items:
              type: object
              properties:
                command: { type: string }
                path: { type: string }
                name: { type: string }
              required: [command]
            description: "Well-known gate key: commands proving a claimed defect_found genuinely fails; empty for adequate/tests_missing"
    must_fail:
      - { from_key: failing_tests }
    side_effects:
      - when:
          - field: coverage_outcome
            eq: defect_found
          - field: failing_tests
            empty: true
        action: append_decision_log
        action_name: coverage_triage_defect_without_tests
        note: "coverage_outcome is defect_found but failing_tests is empty — the claim carries no failing-test evidence and the must_fail gate had nothing to run"
      - action: append_initiative_frontmatter
        field: regression_tests
        from: new_test_paths
    edges:
      - when:
          field: coverage_outcome
          eq: tests_missing
        next: round-out-coverage
        max_traversals: 5
        inject: "coverage-note-quality.md marked coverage_outcome: tests_missing — it names the untested paths. Write tests covering exactly those paths; do not re-scope beyond what it flagged."
      - when:
          field: coverage_outcome
          eq: defect_found
        next: fix
        max_traversals: 5
        inject: "coverage-note-quality.md lists failing_tests — each is a reproducible defect, not a test artifact. Fix the underlying code so every listed test passes; never edit or delete the test to make it pass. round-out-coverage re-runs afterward to add the regression test once the fix lands."
    default_next: red-team

  - id: red-team
    label: Red team
    description: "Actively try to break what was just fixed with adversarial tests, before the final review"
    required: true
    type: agent
    agent_role: red-team
    charter: red-team
    challenge: red-team
    includes: [reflection-scaffold, prove-with-test]
    concerns: [red-teaming, test-quality, testing]
    output:
      file: red-team-note.md
      schema:
        type: object
        additionalProperties: false
        required: [red_team_outcome, failing_tests]
        properties:
          red_team_outcome:
            type: string
            enum: [clean, issues_found]
            description: "Routing key — no adversarial gaps found, or genuine issues found"
          failing_tests:
            type: array
            items:
              type: object
              properties:
                command: { type: string }
                path: { type: string }
                name: { type: string }
              required: [command]
            description: "Well-known gate key: commands proving the red-team's findings genuinely fail"
    must_fail:
      - { from_key: failing_tests }
    side_effects:
      - when:
          - field: red_team_outcome
            eq: issues_found
          - field: failing_tests
            empty: true
        action: append_decision_log
        action_name: red_team_findings_without_tests
        note: "red_team_outcome is issues_found but failing_tests is empty — the findings carry no failing-test evidence and the must_fail gate had nothing to run"
    edges:
      - when:
          field: red_team_outcome
          eq: issues_found
        next: fix
        max_traversals: 5
        inject: "red-team-note.md lists failing_tests — each is a reproducible defect, not a test artifact. Fix the underlying code so every listed test passes; never edit or delete the test to make it pass."
    default_next: review

  - id: review
    label: Review
    description: "Adversarial review of the fix for correctness and regression risk"
    required: true
    type: agent
    agent_role: review
    charter: review-findings
    challenge: fix-review
    includes: [reflection-scaffold, prove-with-test, severity-ladder]
    concerns: [test-quality, security]
    must_pass:
      - { from_key: passing_commands }
    output:
      file: review.md
      schema:
        type: object
        additionalProperties: false
        required: [review_outcome]
        properties:
          review_outcome:
            type: string
            enum: [clean, findings, halt, clean_with_nits_applied]
            description: "Routing key — review verdict"
    edges:
      - when:
          field: review_outcome
          eq: findings
        next: fix
        max_traversals: 5
        inject: "review.md carries severity-laddered findings. Address every finding at the severity the ladder assigns — critical and major findings must be fixed; a minor finding may be deferred only with the justification recorded."
      - when:
          field: review_outcome
          eq: halt
        next: halt
    default_next: retrospective

  - id: retrospective
    label: Retrospective
    description: "Assess what went wrong and whether a defense was added"
    required: true
    type: agent
    agent_role: retrospective
    challenge: retrospective
    output:
      file: retro.md
      schema:
        type: object
        additionalProperties: false
        required: [retro_outcome]
        properties:
          retro_outcome:
            type: string
            enum: [sound, defense_gap, new_bug_found]
            description: "Routing key — retrospective verdict"
    edges:
      - when:
          field: retro_outcome
          eq: defense_gap
        next: fix
        max_traversals: 5
        inject: "retro.md identified a defense_gap — the fix resolved the symptom but no regression test or structural guard prevents recurrence. Add the defense retro.md describes."
      - when:
          field: retro_outcome
          eq: new_bug_found
        next: fix
        max_traversals: 5
        inject: "retro.md's retrospective on this fix uncovered a separate, newly-found bug. Fix the new bug it describes; this is independent of the original symptom already resolved."
    default_next: commit

  - id: commit
    label: Commit
    description: "Commit the reviewed and validated fix"
    required: true
    type: agent
    agent_role: commit
    challenge: true
    default_next: done
