[package]
name = "hares-envelope"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hares-types = { workspace = true }
hares-physics = { workspace = true }
nalgebra = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
chrono.workspace = true

[features]
observe = []
observe_detailed = []
check_invariants = []

[dev-dependencies]
approx = "0.5"
criterion = { workspace = true }

[[bench]]
name = "rc_solver"
path = "benches/rc_solver.rs"
harness = false

# Standing gate for the solver-step performance rule:
# covers the orchestration the rc_solver matrix bench does not —
# build_input_vector, slot-map irradiance lookup, iterative exterior LWR.
[[bench]]
name = "thermal_step"
path = "benches/thermal_step.rs"
harness = false
