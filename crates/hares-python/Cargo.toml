[package]
name = "hares-python"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
observe = ["hares-core/observe"]
# The profiling summary's gate (core) plus the fleet's hook-install
# invariant assertions, which read the leaf's panic-hook machinery: a
# profiling build must carry the fleet's gate as well or those assertions
# compile out while the hook is installed.
profiling = ["hares-core/profiling", "hares-fleet/profiling"]

[lib]
name = "_hares"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
# Version-locked to the pyo3 in use; provides the resolved interpreter's
# lib dir for the test/dev rpath (see build.rs). Since pyo3-build-config 0.29
# no longer inlines build configuration into itself, it resolves the config
# through a direct pyo3 dependency in this build graph.
pyo3-build-config = "0.30"
pyo3 = "0.30"

[dependencies]
hares-core = { workspace = true }
hares-fleet = { workspace = true }
hares-control = { workspace = true }
hares-equipment = { workspace = true }
hares-input = { workspace = true }
hares-output = { workspace = true }
hares-physics = { workspace = true }
hares-tariff = { workspace = true }
hares-types = { workspace = true }
pyo3 = { workspace = true, features = ["auto-initialize"] }
numpy = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
arrow = { workspace = true, features = ["ipc"] }
pyo3-arrow = "0.20"
rand = { workspace = true }
rand_chacha = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uom.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
frame_golden = { path = "../../tools/frame_golden" }
# The py_gym allocation measurements read the leaf's profiling-gated
# module: this dev-dependency turns the feature on for the test targets
# alone (the extension module's production build keeps it out).
hares-types = { workspace = true, features = ["profiling"] }
