[package]
name = "hares-python"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
observe = ["hares-core/observe"]

[lib]
name = "_hares"
crate-type = ["cdylib", "rlib"]

[dependencies]
hares-core = { workspace = true }
hares-fleet = { workspace = true }
hares-control = { workspace = true }
hares-equipment = { workspace = true }
hares-io = { workspace = true }
hares-physics = { workspace = true }
hares-tariff = { workspace = true }
hares-types = { workspace = true }
pyo3 = { workspace = true, features = ["auto-initialize"] }
numpy = { workspace = true }
chrono = { workspace = true }
chrono-tz = "0.10"
arrow = { workspace = true, features = ["ipc"] }
rayon = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
