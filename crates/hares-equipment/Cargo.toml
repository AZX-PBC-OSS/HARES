[package]
name = "hares-equipment"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hares-types = { workspace = true }
hares-physics = { workspace = true }
hares-control = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
crc = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
parquet = { workspace = true }
arrow = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
uom = { workspace = true }
libm = { workspace = true }

[features]
# The clamp census's recording sites live in the leaf's observe-gated
# module, so this crate's observe gate carries the leaf's.
observe = ["hares-types/observe"]

[dev-dependencies]
proptest = { workspace = true }
regex = { workspace = true }
syn = { version = "3", features = ["full", "visit"] }
tempfile = { workspace = true }
