[package]
name = "hares-fleet"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
observe = []
# The panic hook's install machinery is compiled out of no-feature builds
# (the leaf's profiling gate), and the hook-install invariant's debug
# assertions above sit in this crate's profiling-gated code, so this gate
# carries the leaf's.
profiling = ["hares-types/profiling"]

[dependencies]
hares-core = { workspace = true }
hares-input = { workspace = true }
hares-output = { workspace = true }
hares-types = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true }
arrow = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
parquet = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
hares-control = { workspace = true }
# The unit tests' global counting allocator and the step-handoff
# witnesses read the leaf's profiling-gated module: this dev-dependency
# turns the feature on for the test targets alone.
hares-types = { workspace = true, features = ["profiling"] }
