[package]
name = "hares-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
profiling = []
observe = []

[dependencies]
hares-types = { workspace = true }
hares-physics = { workspace = true }
hares-envelope = { workspace = true }
hares-control = { workspace = true }
hares-equipment = { workspace = true }
hares-io = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
serde = { workspace = true }
serde_json = "1"
arrow = { workspace = true }
nalgebra = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
parquet = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
criterion = { workspace = true }
hares-fleet = { workspace = true }
rayon = { workspace = true }

[[bench]]
name = "single_building"
path = "../../benches/single_building.rs"
harness = false

[[bench]]
name = "fleet"
path = "../../benches/fleet.rs"
harness = false

[[bench]]
name = "rl_step"
path = "../../benches/rl_step.rs"
harness = false

