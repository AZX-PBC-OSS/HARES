[package]
name = "hares-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
profiling = []
actor_profiling = []
observe = ["hares-types/observe", "hares-io/observe", "hares-equipment/observe", "hares-envelope/observe", "hares-physics/observe", "hares-tariff/observe"]
observe_detailed = ["observe", "hares-envelope/observe_detailed"]
check_invariants = ["hares-io/check_invariants", "hares-equipment/check_invariants", "hares-envelope/check_invariants", "hares-tariff/check_invariants"]
dst = []

[dependencies]
hares-types = { workspace = true }
hares-physics = { workspace = true }
hares-envelope = { workspace = true }
hares-control = { workspace = true }
hares-equipment = { workspace = true }
hares-io = { workspace = true }
hares-tariff = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_distr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true }
arrow = { workspace = true }
nalgebra = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
chrono-tz = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
parquet = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["fmt"] }
criterion = { workspace = true }
hares-fleet = { workspace = true }
rayon = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "regression"
path = "../../tests/regression/mod.rs"

[[bench]]
name = "single_building"
path = "../../benches/single_building.rs"
harness = false

[[bench]]
name = "fleet"
path = "../../benches/fleet.rs"
harness = false

[[bench]]
name = "rl_step"
path = "../../benches/rl_step.rs"
harness = false

