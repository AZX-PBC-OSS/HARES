[package]
name = "hares-types"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
observe = []
# The allocation census's counting allocator: `alloc_count` is compiled
# only under this feature, so the leaf's default build carries none of
# the allocator machinery. The census's readers (the profiling summary,
# the frame_golden tool, the tests' global allocators) enable it.
profiling = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
bitflags = { workspace = true, features = ["serde"] }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_distr = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }
uom = { workspace = true }
libm = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
strum = { workspace = true }
# This crate's own test targets compile `alloc_count` and its tests,
# which the profiling feature gates: the self dev-dependency turns the
# feature on for the test targets alone, so the alloc-count witnesses
# run in every test profile while the default build keeps the module
# out.
hares-types = { workspace = true, features = ["profiling"] }
