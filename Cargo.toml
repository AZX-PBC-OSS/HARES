[workspace]
members = [
    "crates/hares-types",
    "crates/hares-physics",
    "crates/hares-envelope",
    "crates/hares-control",
    "crates/hares-equipment",
    "crates/hares-io",
    "crates/hares-core",
    "crates/hares-fleet",
    "crates/hares-tariff",
    "crates/hares-python",
    "tools/frame_golden",
]
default-members = [
    "crates/hares-types",
    "crates/hares-physics",
    "crates/hares-envelope",
    "crates/hares-control",
    "crates/hares-equipment",
    "crates/hares-io",
    "crates/hares-core",
    "crates/hares-tariff",
    "crates/hares-fleet",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "BSD-3-Clause"
repository = "https://github.com/AZX-PBC-OSS/HARES"

[workspace.dependencies]
# Internal crates
hares-types = { path = "crates/hares-types" }
hares-physics = { path = "crates/hares-physics" }
hares-envelope = { path = "crates/hares-envelope" }
hares-control = { path = "crates/hares-control" }
hares-equipment = { path = "crates/hares-equipment" }
hares-io = { path = "crates/hares-io" }
hares-core = { path = "crates/hares-core" }
hares-tariff = { path = "crates/hares-tariff" }
hares-fleet = { path = "crates/hares-fleet" }

# External dependencies
nalgebra = "0.35"
arrow = "59"
parquet = "59"
pyo3 = "0.29"
uom = "0.38"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
# Exact f64 round-tripping for every crate: without float_roundtrip
# serde_json's parser is a few ULP off for long decimals, so a checkpoint
# file or a golden would reload differently from the values that wrote it.
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = "0.4"
chrono-tz = "0.10"
# Coordinate -> IANA timezone lookup (Natural Earth tz polygons). Used by the
# site-location resolver to derive a civil UTC offset from lat/lon when neither
# the HPXML nor the weather file supplies one.
tzf-rs = "2.1"
quick-xml = "0.42"
rand = "0.10"
rand_chacha = "0.10"
rand_distr = "0.6"
tracing = { version = "0.1", features = ["release_max_level_info"] }
thiserror = "2"
bitflags = "2"
toml = "1"
numpy = "0.29"
# Default features pull `heapless` 0.7 (via `heapless-cas`) for no_std CAS
# support; HARES only calls to_allocvec, to_allocvec_crc, from_bytes and
# from_bytes_crc, which need nothing beyond `alloc` + `use-crc`.
postcard = { version = "1", default-features = false, features = ["alloc", "use-crc"] }
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3"
sha2 = "0.11"
crc = "3"
proptest = "1"
strum = { version = "0.28", features = ["derive"] }
regex = "1"
