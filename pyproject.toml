[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "ochre_next"
version = "0.1.0"
description = "HARES: High-performance Architecture for Residential Energy Simulation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.3",
    "polars>=1.39.3",
    "pyarrow>=23.0.1",
]
license = {text = "BSD-3-Clause"}
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
sam = ["NREL-PySAM>=7.1.0"]
pybamm = ["pybamm>=26.3.0"]
resstock = ["boto3>=1.42.76", "httpx>=0.28.1"]
helics = ["helics>=3.6.1"]
rl = ["gymnasium>=1.2.3"]
dev = [
    "pytest>=9.0.2",
    "maturin>=1.12.6",
    "ruff>=0.15.7",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "maturin>=1.12.6",
    "ruff>=0.15.7",
    "psychrolib>=2.5.0",
    "numpy>=2.4.3",
]

[tool.uv]
default-groups = ["dev"]

[tool.maturin]
python-source = "python"
module-name = "ochre_next._hares"
manifest-path = "crates/hares-python/Cargo.toml"
include = [
    {path = "defaults/**", format = ["sdist", "wheel"]},
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
