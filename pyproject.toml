[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "ochre_next"
version = "0.1.0"
description = "HARES: High-performance Agent-based Residential Energy Simulation"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.3",
    "polars>=1.39.3",
    "pyarrow>=23.0.1",
]
license = {text = "BSD-3-Clause"}
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
sam = ["NREL-PySAM>=7.1.0"]
pybamm = ["pybamm>=26.3.0"]
resstock = ["boto3>=1.42.78", "httpx>=0.28.1"]
helics = ["helics>=3.6.1"]
rl = ["gymnasium>=1.2.3"]
notebook = ["marimo>=0.21.1", "plotly>=6.6.0"]
ochre = [
    "xmltodict>=0.14.1",
]
dev = [
    "pytest>=9.0.2",
    "maturin>=1.12.6",
    "ruff>=0.15.8",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "maturin>=1.12.6",
    "ruff>=0.15.8",
    "psychrolib>=2.5.0",
    "numpy>=2.4.3",
    "pytest-xdist>=3.8.0",
]
ochre = [
    "boto3>=1.42.78",
    "click>=8.1",
    "fastparquet>=2026.3.0",
    "matplotlib>=3.10.8",
    "nrel-pysam>=7.1.0",
    "numba>=0.64.0",
    "pandas>=2.0",
    "pint>=0.24,<0.25",
    "psychrolib>=2.5.0",
    "pvlib>=0.15.0",
    "pyarrow>=23.0.1",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2026.1.post1",
    "rainflow>=3.2.0",
    "scipy>=1.17.1",
    "xmltodict>=1.0.4",
]

[tool.uv]
default-groups = ["dev"]

[tool.maturin]
python-source = "python"
module-name = "ochre_next._hares"
manifest-path = "crates/hares-python/Cargo.toml"
include = [
    {path = "defaults/**", format = ["sdist", "wheel"]},
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-n auto -m 'not slow'"
markers = [
    "slow: marks tests as slow (run with '-m slow' or '--run-slow')",
]
