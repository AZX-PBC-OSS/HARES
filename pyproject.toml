[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "ochre_next"
version = "0.1.0"
description = "HARES: High-performance Architecture for Residential Energy Simulation"
requires-python = ">=3.11"
dependencies = [
    "polars>=1",
    "pyarrow>=18",
]
license = {text = "BSD-3-Clause"}
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
sam = ["NREL-PySAM>=5"]
pybamm = ["pybamm>=24"]
resstock = ["boto3>=1.35", "httpx>=0.27"]
helics = ["helics>=3"]
rl = ["gymnasium>=1"]
dev = [
    "pytest>=8",
    "maturin>=1.7",
    "ruff>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "maturin>=1.7",
    "ruff>=0.8",
    "psychrolib>=2.5.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.maturin]
python-source = "python"
module-name = "ochre_next._hares"
manifest-path = "crates/hares-python/Cargo.toml"
include = [
    {path = "defaults/**", format = ["sdist", "wheel"]},
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
