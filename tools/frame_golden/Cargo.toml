[package]
name = "frame_golden"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
dst = ["hares-core/dst"]
observe = ["hares-core/observe"]
# The tool's allocator install reads the leaf's counting allocator,
# which lives in the leaf's profiling-gated module, so this gate
# carries the leaf's beside the core's.
profiling = ["hares-core/profiling", "hares-types/profiling"]

[dependencies]
hares-core = { workspace = true }
hares-types = { workspace = true }
hares-fleet = { workspace = true }
hares-input = { workspace = true }
hares-output = { workspace = true }
hares-tariff = { workspace = true }
arrow = { workspace = true }
parquet = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The allocator-presence tests read the leaf's profiling-gated module:
# this dev-dependency turns the feature on for the test targets alone
# (the tool's own install stays behind the profiling feature).
hares-types = { workspace = true, features = ["profiling"] }
