[package]
name = "frame_golden"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
dst = ["hares-core/dst"]
profiling = ["hares-core/profiling"]

[dependencies]
hares-core = { workspace = true }
hares-types = { workspace = true }
hares-fleet = { workspace = true }
hares-io = { workspace = true }
hares-tariff = { workspace = true }
arrow = { workspace = true }
parquet = { workspace = true }
serde = { workspace = true }
# Exact f64 round-tripping through the golden JSON: without this feature
# serde_json's parser is a few ULP off for long decimals, which would make
# a reloaded golden differ from the capture that wrote it.
serde_json = { workspace = true, features = ["float_roundtrip"] }
toml = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
